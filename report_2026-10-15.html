const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmt = (n,d=1) => n==null?'—':Number(n).toLocaleString('zh-CN',{minimumFractionDigits:0,maximumFractionDigits:d});

/* 机会全景（三层结构） */
(function(){
  const o = DATA.opportunity_v2;
  if(!o){ $('opp-card').style.display='none'; $('opp-signals').style.display='none'; return; }
  // 第一层：一句话总结
  $('opp-card').innerHTML = `
    <div class="opp-icon">🎯</div>
    <div class="opp-body">
      <div class="opp-title">今日机会全景（${DATA.meta.data_date}）</div>
      <div class="opp-text">${esc(o.summary)}</div>
    </div>`;
  // 第二层：三大信号卡
  $('opp-signals').innerHTML = o.signals.map(s=>{
    const items = s.items.map(it=>`${esc(it.商品一级类目名称)}·${esc(it.商品二级类目名称)} <b style="color:#c0392b">+${it.rate}%</b>`).join('<br>');
    return `<div style="border:1px solid var(--g200);border-radius:8px;padding:12px 14px;background:#fff">
      <div style="font-size:12px;font-weight:800;margin-bottom:6px">${s.theme}</div>
      <div style="font-size:10px;color:var(--g500);margin-bottom:6px">${s.desc}</div>
      <div style="font-size:11px;line-height:1.7">${items || '<span style="color:var(--g400)">今日无显著信号</span>'}</div>
    </div>`;
  }).join('');
})();

/* 爆品榜单 */
(function(){
  const noImg = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="200" height="200" fill="#F3F4F6"/><text x="100" y="105" font-size="14" fill="#9CA3AF" text-anchor="middle">暂无主图</text></svg>');
  const tabs = DATA.tabs;
  $('bp-tabs').innerHTML = tabs.map((t,i)=>`<div class="tab${t.cat1==='男装'?' active':''}" data-i="${i}">${esc(t.cat1)}</div>`).join('');
  function renderTab(idx){
    const t = tabs[idx];
    $('bp-grid').innerHTML = t.cats.map(c=>{
      const rateTxt = c.rate==null?'':` · 环比 <b style="color:${c.rate>=0?'#fca5a5':'#86efac'}">${c.rate>=0?'+':''}${c.rate}%</b>`;
      const flexTag = c.seat==='机动' ? '<span style="background:#f59e0b;color:#fff;font-size:9px;padding:1px 7px;border-radius:8px;margin-left:6px">⚡起量</span>' : '';
      const items = c.items.map(it=>{
        const mts = it.mt.map(m=>`<div class="bp-mt"><a href="${m.url}" target="_blank" rel="noopener">▶ 素材</a><span>消耗${m.cost_r} · 曝光${m.exp_r}</span><span class="ms">3s ${m.p3_r} · 完播 ${m.finish_r}</span></div>`).join('') || '<div class="bp-mt"><span class="ms">昨日无消耗素材记录</span></div>';
        return `<div class="bp-item">
          <img class="bp-img" src="${it.img||noImg}" onerror="this.onerror=null;this.src='${noImg}'" loading="lazy" alt="商品主图">
          <div class="bp-body">
            <div class="bp-name">${esc(it.name)}</div>
            <div class="bp-nums">
              <div><div class="k">总消耗</div><div class="v" style="color:#c2410c">${it.cost_r}</div></div>
              <div><div class="k">ROI</div><div class="v">${it.roi_r}</div></div>
              <div><div class="k">GMV</div><div class="v">${it.gmv_r}</div></div>
              <div><div class="k">客单价</div><div class="v">${it.price==null?'—':fmt(it.price,0)+'元'}</div></div>
            </div>
            <div class="bp-acct"><a class="bp-link" href="${it.link}" target="_blank" rel="noopener">商品详情 ↗</a></div>
          </div>
          <div class="bp-mts"><div class="mt-t">🎬 TOP${it.mt.length} 跑量素材</div>${mts}</div>
        </div>`;
      }).join('');
      return `<div class="bp-cat"><div class="bp-cat-h"><span class="cn">${esc(c.cat2)}</span>${flexTag}<span class="cc">消耗 ${c.cost_r}${rateTxt}</span></div><div class="bp-items">${items}</div></div>`;
    }).join('');
  }
  $('bp-tabs').addEventListener('click',e=>{
    const t=e.target.closest('.tab');if(!t)return;
    document.querySelectorAll('#bp-tabs .tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');renderTab(+t.dataset.i);
  });
  renderTab(tabs.findIndex(t=>t.cat1==='男装'));
})();
