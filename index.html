const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmt = (n,d=1) => n==null?'—':Number(n).toLocaleString('zh-CN',{minimumFractionDigits:0,maximumFractionDigits:d});

/* 使用指南横幅 */
(function(){
  $('guide-banner').innerHTML = '<b>📖 使用指南：</b>每周一中午 12:00 更新近 7 天数据（数据周期 ' + DATA.meta.data_date + ' · 更新于 ' + DATA.meta.gen_time + '） · 仅保留最近 4 期存档 · 爆品筛选：11 个一级类目 → 每类 5 个二级类目（消耗 TOP4 + 起量最快 1 个）→ 每类 6 个商品配 TOP3 素材';
})();

/* 机会全景 */
(function(){
  const p = DATA.pano;
  if(!p){ $('opp-card').style.display='none'; return; }
  let html = '<div class="opp-icon">🎯</div><div class="opp-body"><div class="opp-title">本周机会全景（' + DATA.meta.data_date + '）</div>';
  if(p.weather_signal){
    html += '<div class="opp-text" style="margin-bottom:4px">🌡 <b>气温信号：</b>' + esc(p.weather_signal) + '</div>';
  }
  if(p.cat_verify && p.cat_verify.length){
    const cv = p.cat_verify.map(c => esc(c.cat2) + ' <b style="color:#c0392b">+' + c.rate + '%</b>').join('、');
    html += '<div class="opp-text" style="margin-bottom:4px">📈 <b>品类验证：</b>降温已在数据兑现——' + cv + '</div>';
  }
  html += '<div class="opp-text">💡 <b>机会提醒：</b>有保暖/冬装货盘的商家可抓住降温窗口提前备货投流，可参考下方 ' + esc(p.ref_cats) + ' 类目的跑量商品与素材。</div>';
  html += '</div>';
  $('opp-card').innerHTML = html;
})();

/* TOP5 */
(function(){
  $('top5').innerHTML = DATA.top5.map((t,i)=>`<div class="top5-i"><span class="r">${i+1}</span><div class="n">${esc(t.name)}</div><div class="m">${esc(t.cat)} · 日均 <b>${t.daily_avg_r}</b> · ROI <b>${t.roi_r}</b></div></div>`).join('');
})();

/* 日期 Tab */
(function(){
  const dates = DATA.archive_dates || [];
  // 文件名映射：'2026-10-09 至 2026-10-15' -> 'report_2026-10-09_10-15.html'
  const toFile = d => {
    if(d.includes('至')) return 'report_' + d.split(' 至 ')[0] + '_' + d.split(' 至 ')[1].slice(5) + '.html';
    return 'report_' + d + '.html';
  };
  $('date-tabs').innerHTML = dates.map(d => {
    const active = d === DATA.meta.data_date ? ' active' : '';
    return `<a href="${toFile(d)}" class="date-tab${active}">${d}</a>`;
  }).join('');
})();

/* 爆品榜单 */
(function(){
  const noImg = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="200" height="200" fill="#F3F4F6"/><text x="100" y="105" font-size="14" fill="#9CA3AF" text-anchor="middle">暂无主图</text></svg>');
  const tabs = DATA.tabs;
  $('bp-tabs').innerHTML = tabs.map((t,i)=>`<div class="tab${t.cat1==='男装'?' active':''}" data-i="${i}">${esc(t.cat1)}</div>`).join('');
  function renderTab(idx){
    const t = tabs[idx];
    $('bp-grid').innerHTML = t.cats.map(c=>{
      const rateTxt = c.rate==null?'':` · 周环比 <b style="color:${c.rate>=0?'#fca5a5':'#86efac'}">${c.rate>=0?'+':''}${c.rate}%</b>`;
      const flexTag = c.seat==='机动' ? '<span style="background:#f59e0b;color:#fff;font-size:9px;padding:1px 7px;border-radius:8px;margin-left:6px">⚡起量</span>' : '';
      const items = c.items.map(it=>{
        const mts = it.mt.map((m,mi)=>{
          const maxCost = it.mt[0] ? it.mt[0].cost : 1;
          const pct = maxCost > 0 ? Math.round(m.cost / maxCost * 100) : 0;
          return `<div class="bp-mt"><a class="play-btn" href="${m.url}" target="_blank" rel="noopener">▶ 播放</a><div class="bar"><div class="bar-in" style="width:${pct}%"></div></div><span class="ms">${m.cost_r}·曝${m.exp_r}·3s${m.p3_r}</span></div>`;
        }).join('') || '<div class="bp-mt"><span class="ms">上周无消耗素材</span></div>';
        return `<div class="bp-item">
          <img class="bp-img" src="${it.img||noImg}" onerror="this.onerror=null;this.src='${noImg}'" loading="lazy" alt="商品主图">
          <div class="bp-body">
            <div class="bp-name">${esc(it.name)}</div>
            <div class="bp-nums">
              <div><div class="k">日均消耗</div><div class="v big">${it.daily_avg_r}</div></div>
              <div><div class="k">ROI</div><div class="v">${it.roi_r}</div></div>
              <div><div class="k">7天累计</div><div class="v">${it.cost_r}</div></div>
              <div><div class="k">客单价</div><div class="v">${it.price==null?'—':fmt(it.price,0)+'元'}</div></div>
            </div>
            <div style="margin-top:4px"><a class="bp-link" href="${it.link}" target="_blank" rel="noopener">商品详情 ↗</a></div>
          </div>
          <div class="bp-mts"><div class="mt-t">🎬 TOP${it.mt.length} 素材</div>${mts}</div>
        </div>`;
      }).join('');
      return `<div class="bp-cat"><div class="bp-cat-h"><span class="cn">${esc(c.cat2)}</span>${flexTag}<span class="cc">日均 ${c.daily_avg_r} · 累计 ${c.cost_r}${rateTxt}</span></div><div class="bp-items">${items}</div></div>`;
    }).join('');
  }
  $('bp-tabs').addEventListener('click',e=>{
    const t=e.target.closest('.tab');if(!t)return;
    document.querySelectorAll('#bp-tabs .tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');renderTab(+t.dataset.i);
  });
  renderTab(tabs.findIndex(t=>t.cat1==='男装'));
})();

(function(){
